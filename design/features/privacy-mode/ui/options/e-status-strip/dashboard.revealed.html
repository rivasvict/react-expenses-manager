<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E · Dashboard, figures shown</title>
  <link rel="stylesheet" href="../../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../../system/mockup.css">
  <style>
    .mk-work-area { display: flex; flex-direction: column; }
    .mk-header { padding-bottom: calc(0.75rem + 4px); }
    .bar-chips { margin-left: auto; display: flex; gap: 0.5rem; }
    .bar-chip { width: 2.4rem; height: 2.4rem; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .bar-chip--on { color: var(--accent); background-color: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
    .month-header { margin: 1.1rem 0; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .month-header .mk-title { flex: 1 1 auto; line-height: 1.2; }
    .step { width: 2.5rem; height: 2.5rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .step--disabled { opacity: 0.35; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0 0 0.625rem; padding: 1.1rem 1.15rem; }
    .hero__body { display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; min-width: 0; }
    .hero__label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
    .hero__amount { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--income); }
    .hero__chevron { flex: 0 0 auto; color: var(--text-muted); display: flex; }
    .chart { height: 214px; margin: 0 0 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .chart__ring { position: relative; width: 176px; }
    .chart__ring > svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; gap: 1.1rem; margin: 0 0 0.35rem; font-size: 12px; color: var(--text-secondary); }
    .legend__dot { display: inline-block; width: 8px; height: 8px; margin-right: 0.4rem; border-radius: var(--radius-round); }
    .row { display: flex; align-items: center; gap: 0.75rem; margin: 0 0 0.625rem; padding: 0.85rem 0.9rem; }
    .row__chip { width: 2.4rem; height: 2.4rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); }
    .row__name { flex: 1 1 auto; font-weight: 500; }
    .row__amount { font-weight: 600; font-size: 1.05rem; }
    .row--income .row__chip { color: var(--income); background-color: var(--income-soft); }
    .row--income .row__amount { color: var(--income); }
    .row--expense .row__chip { color: var(--expense); background-color: var(--expense-soft); }
    .row--expense .row__amount { color: var(--expense); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; padding-top: 0.5rem; margin: auto -0.75rem 0; }
    .delta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.5rem; margin-top: 0.35rem; }
    .delta__pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 700; line-height: 1.5; color: var(--income); background-color: var(--income-soft); }
    .delta__caption { font-size: 0.82rem; color: var(--text-secondary); }
    .arrow { width: 0.8em; height: 0.8em; }
    /* Masked figure: a fixed-width run of dots, never the real digit count. */
    .mask { letter-spacing: 0.12em; color: var(--text-secondary); font-weight: 600; }
    .mask--hero { font-size: 2rem; line-height: 1.15; }
    .delta__pill--mask { color: var(--text-secondary); background-color: var(--highlight); }
    .row--income .row__amount.mask, .row--expense .row__amount.mask { color: var(--text-secondary); }
    .row--income .row__chip.neutral, .row--expense .row__chip.neutral { color: var(--text-secondary); background-color: var(--highlight); }
    .spacer { flex: 1 1 auto; }
    .stack { display: flex; flex-direction: column; gap: 0.625rem; }
    .settings-card { margin: 0.625rem -0.75rem 0; padding: 1rem 1.1rem 1.1rem; }
    .srow { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 3.4rem; padding: 0.65rem 0.9rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .srow__label { display: block; font-weight: 600; font-size: 0.95rem; }
    .srow__hint { display: block; color: var(--text-secondary); font-size: 0.78rem; line-height: 1.4; }
    .srow__value { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.92rem; flex: 0 0 auto; }
    .switch { flex: 0 0 auto; width: 2.7rem; height: 1.55rem; padding: 0.2rem; display: flex; border-radius: var(--radius-pill); background-color: var(--highlight); border: 1px solid var(--border-strong); }
    .switch::after { content: ""; width: 1.05rem; height: 1.05rem; border-radius: var(--radius-round); background-color: var(--text-secondary); }
    .switch--on { background-color: var(--accent); border-color: var(--accent); justify-content: flex-end; }
    .switch--on::after { background-color: var(--text-on-accent); }
    .version { margin: 1.25rem 0 0; text-align: center; font-size: 0.78rem; color: var(--text-muted); }

    .bar-chip--acct { font-weight: 700; color: var(--accent); background-color: var(--accent-soft); border-radius: var(--radius-round); }
    /* Blurred placeholder: a fixed-width stand-in, never the real figure. */
    .blur { filter: blur(0.4em); user-select: none; color: var(--text-secondary); }
    .hero__amount.blur, .row__amount.blur { color: var(--text-secondary); }
    .delta__pill.blur { color: var(--text-secondary); background-color: var(--highlight); }
    .label-row { display: flex; align-items: center; gap: 0.4rem; }
    .eye { width: 2.2rem; height: 2.2rem; margin: -0.3rem 0; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); background-color: transparent; border-radius: var(--radius-round); }
    .eye--hidden { color: var(--accent); background-color: var(--accent-soft); }
    .strip { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; min-height: 2.6rem; margin: 0 0 0.75rem; padding: 0.4rem 0.9rem; font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--text-primary); background-color: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); border-radius: var(--radius-control); }
    .strip svg { color: var(--accent); flex: 0 0 auto; }
    .strip__sub { font-weight: 500; color: var(--text-secondary); }
    .strip--shown { color: var(--text-secondary); background-color: transparent; border-color: var(--border-subtle); }
    .strip--shown svg { color: var(--text-secondary); }
    .month-header { margin: 1.1rem 0 0.9rem; }
  </style>
</head>
<body class="mk">
  <header class="mk-header"><svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo"><rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/><path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/><path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/></svg><span class="mk-header__name">Expenses Tracker</span><span class="bar-chips"><span class="bar-chip" role="button" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" style="fill: none; stroke: currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" style="fill: none; stroke: currentColor" stroke-width="1.4"/></svg></span><span class="bar-chip bar-chip--acct" role="button" aria-label="Account">V</span></span></header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h3 class="mk-eyebrow">Monthly Balance</h3>
      <div class="month-header">
        <span class="step" role="button" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
        <h1 class="mk-title">October 2026</h1>
        <span class="step step--disabled" role="button" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </div>
      <span class="strip strip--shown" role="button"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z" style="fill: none; stroke: currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" style="fill: none; stroke: currentColor" stroke-width="1.4"/><path d="m2.5 13.5 11-11" style="fill: none; stroke: currentColor" stroke-width="1.4"/></svg>Figures shown <span class="strip__sub">· Tap to hide</span></span>
      <div class="mk-card hero">
        <span class="hero__body">
          <span class="label-row"><span class="hero__label">Savings</span></span>
          <span class="hero__amount">$1,620.00</span>
          <span class="delta"><span class="delta__pill" aria-hidden="true"><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5 10.5 6.5H7.4V10.5H4.6V6.5H1.5Z" style="fill: currentColor"/></svg>+12.5%</span><span class="delta__caption" aria-hidden="true">vs September</span></span>
        </span>
        <span class="hero__chevron"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </div>
      <div class="chart"><div class="chart__ring"><svg viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-90 50 50)"><circle cx="50" cy="50" r="40.3" stroke-width="15.4" style="fill: none; stroke: var(--chart-expense)" stroke-dasharray="154.3 98.9"/><circle cx="50" cy="50" r="40.3" stroke-width="15.4" style="fill: none; stroke: var(--chart-income)" stroke-dasharray="96.5 156.7" stroke-dashoffset="-155.5"/></g></svg></div><div class="legend"><span><span class="legend__dot" style="background-color: var(--chart-expense)"></span>Expenses</span><span><span class="legend__dot" style="background-color: var(--chart-income)"></span>Savings</span></div></div>
      <div class="mk-card row row--income"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v10M3.5 7.5 8 12l4.5-4.5" style="fill: none; stroke: currentColor" stroke-width="1.6"/></svg></span><span class="row__name">Incomes</span><span class="row__amount">$4,200.00</span></div>
      <div class="mk-card row row--expense"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14V4M3.5 8.5 8 4l4.5 4.5" style="fill: none; stroke: currentColor" stroke-width="1.6"/></svg></span><span class="row__name">Expenses</span><span class="row__amount">$2,580.00</span></div>
      <div class="actions"><span class="mk-btn mk-btn--primary">Add Income</span><span class="mk-btn mk-btn--secondary">Add Expenses</span></div>
    </div>
  </main>
</body>
</html>
