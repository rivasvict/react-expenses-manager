<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Añadir límite — formulario vacío</title>
  <link rel="stylesheet" href="../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../system/mockup.css">
</head>
<body class="mk">
  <header class="mk-header">
      <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Logo de Control de Gastos">
        <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
        <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
        <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
      </svg>
    <span class="mk-header__name">Control de Gastos</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h3 class="mk-eyebrow">Límites</h3>
      <div class="mk-tile">Añadir límite</div>
      <div class="mk-form">
        <span class="mk-label">Categoría</span>
        <p class="mk-hint">Elige una de tus categorías para darle un límite de gasto mensual.</p>
        <div class="mk-select mk-select--placeholder"><span>Selecciona una categoría</span><svg class="mk-select__chevron" viewBox="0 0 16 16" aria-hidden="true"><path style="fill: var(--text-secondary)" d="M7.976 10.072l4.357-4.357.62.618L8.284 11h-.618L3 6.333l.619-.618 4.357 4.357z"/></svg></div>
        <span class="mk-label mk-field-gap">Asignación mensual</span>
        <input class="mk-input" type="number" placeholder="Introduce la asignación del límite" readonly>
        <div class="mk-actions">
          <a class="mk-btn mk-btn--primary mk-space-top" href="#">Guardar</a>
          <button class="mk-btn mk-btn--secondary mk-space-top" type="button">Cancelar</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
