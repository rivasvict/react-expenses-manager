<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Option C: custom range sheet</title>
  <link rel="stylesheet" href="../../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../../system/mockup.css">
  <style>
    .mk-work-area { display: flex; flex-direction: column; }
    .month-header { margin: 1.1rem 0; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .month-header .mk-title { flex: 1 1 auto; line-height: 1.2; }
    .step { width: 2.5rem; height: 2.5rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .step--disabled { opacity: 0.35; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0 0 0.625rem; padding: 1.1rem 1.15rem; color: inherit; text-decoration: none; }
    .hero__body { display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; min-width: 0; }
    .hero__label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
    .hero__amount { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--income); }
    .hero__chevron { flex: 0 0 auto; color: var(--text-muted); display: flex; }
    .chart { height: 214px; margin: 0 0 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .chart__ring { width: 176px; }
    .chart__ring > svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; gap: 1.1rem; margin: 0 0 0.35rem; font-size: 12px; color: var(--text-secondary); }
    .legend__dot { display: inline-block; width: 8px; height: 8px; margin-right: 0.4rem; border-radius: var(--radius-round); }
    .row { display: flex; align-items: center; color: inherit; text-decoration: none; gap: 0.75rem; margin: 0 0 0.625rem; padding: 0.85rem 0.9rem; }
    .row__chip { width: 2.4rem; height: 2.4rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); }
    .row__name { flex: 1 1 auto; font-weight: 500; }
    .row__amount { font-weight: 600; font-size: 1.05rem; }
    .row--income .row__chip { color: var(--income); background-color: var(--income-soft); }
    .row--income .row__amount { color: var(--income); }
    .row--expense .row__chip { color: var(--expense); background-color: var(--expense-soft); }
    .row--expense .row__amount { color: var(--expense); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; padding-top: 0.5rem; margin: auto -0.75rem 0; }
    .arrow { width: 0.8em; height: 0.8em; flex: 0 0 auto; }
    .tone--up { color: var(--income); }
    .tone--down { color: var(--expense); }
    .tone--flat { color: var(--text-secondary); }
    .delta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.5rem; margin-top: 0.35rem; }
    .delta__pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .delta__pill.tone--up { background-color: var(--income-soft); }
    .delta__pill.tone--down { background-color: var(--expense-soft); }
    .delta__caption { font-size: 0.82rem; color: var(--text-secondary); }

    /* Savings trend screen */
    .seg { display: flex; padding: 0.2rem; gap: 0.2rem; margin: 0 0 0.75rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .seg__item { flex: 1 1 0; min-width: 0; height: 2.6rem; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-radius: var(--radius-control); }
    .seg__item--on { color: var(--text-on-accent); background-color: var(--accent); }
    .seg__item--off { opacity: 0.35; }
    .seg__item svg { width: 1.05rem; height: 1.05rem; }
    .figure { margin: 0 0 0.75rem; padding: 1rem 1.15rem; }
    .figure__label { display: block; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
    .figure__amount { display: block; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .figure__sub { display: block; margin-top: 0.3rem; font-size: 0.85rem; color: var(--text-secondary); }
    .plot { margin: 0 0 0.75rem; padding: 0.75rem 0.5rem 0.5rem; }
    .plot svg { display: block; width: 100%; height: auto; overflow: visible; }
    .key { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; padding: 0.5rem 0.5rem 0; font-size: 12px; color: var(--text-secondary); }
    .key__swatch { display: inline-block; width: 12px; height: 8px; margin-right: 0.4rem; vertical-align: middle; border-radius: 2px; }
    .key__line { display: inline-block; width: 14px; margin-right: 0.4rem; vertical-align: middle; border-top: 2px dashed var(--border-strong); }
    .note { margin: 0; font-size: 0.82rem; line-height: 1.45; color: var(--text-secondary); text-align: center; }

    .verdict { margin: 0 0 0.75rem; padding: 1rem 1.15rem; display: flex; gap: 0.85rem; align-items: flex-start; }
    .verdict__chip { width: 2.4rem; height: 2.4rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); }
    .verdict__chip.tone--up { background-color: var(--income-soft); }
    .verdict__title { display: block; font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
    .verdict__sub { display: block; margin-top: 0.25rem; font-size: 0.88rem; color: var(--text-secondary); }
    .verdict__sub strong { color: var(--text-primary); font-weight: 600; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin: 0 0 0.5rem; }
    .bar__title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary); }
    .range { display: inline-flex; align-items: center; gap: 0.35rem; height: 2.5rem; padding: 0 0.85rem; font-size: 0.88rem; font-weight: 600; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); white-space: nowrap; }
    .range svg { width: 14px; height: 14px; }
    .tip { position: absolute; padding: 0.35rem 0.6rem; font-size: 0.78rem; line-height: 1.35; background-color: var(--bg-raised-hover); border: 1px solid var(--border-strong); border-radius: var(--radius-control); box-shadow: var(--shadow-pop); white-space: nowrap; }
    .tip strong { display: block; font-size: 0.85rem; }
    .plot { position: relative; }
    .menu { position: absolute; right: 0; top: 2.9rem; z-index: 2; width: 15.5rem; padding: 0.35rem; background-color: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-card); box-shadow: var(--shadow-pop); }
    .menu__item { display: flex; align-items: center; justify-content: space-between; height: 2.75rem; padding: 0 0.75rem; border-radius: var(--radius-control); font-size: 0.92rem; }
    .menu__item--on { font-weight: 700; background-color: var(--highlight); }
    .menu__item--on svg { color: var(--accent); }
    .menu__hint { font-size: 0.78rem; color: var(--text-muted); font-weight: 400; }
    .menu__foot { margin-top: 0.3rem; padding-top: 0.3rem; border-top: 1px solid var(--border-subtle); }
    .menu__foot .menu__item { color: var(--accent); font-weight: 600; }
    .bar-wrap { position: relative; }

    .scrim { position: fixed; inset: 0; background-color: var(--scrim); }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 40rem; margin: 0 auto; padding: 1.1rem 1.25rem 1.5rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-shell) var(--radius-shell) 0 0; box-shadow: var(--shadow-pop); }
    .sheet__grip { width: 2.5rem; height: 4px; margin: 0 auto 0.9rem; background-color: var(--border-strong); border-radius: var(--radius-pill); }
    .sheet__title { margin: 0 0 0.25rem; font-size: 1.05rem; font-weight: 700; }
    .pair { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0.5rem; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin: 0.9rem 0 0.75rem; }
    .tab { padding: 0.5rem 0.75rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .tab--on { border-color: var(--accent); box-shadow: 0 0 0 0.2rem var(--accent-soft); }
    .tab__label { display: block; font-size: 0.75rem; color: var(--text-secondary); }
    .tab__value { display: block; font-weight: 600; }
    .yearbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .yearbar__year { font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
    .cell { height: 2.75rem; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 500; border-radius: var(--radius-control); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); }
    .cell--in { background-color: var(--accent-soft); border-color: transparent; }
    .cell--end { color: var(--text-on-accent); background-color: var(--accent); border-color: var(--accent); font-weight: 700; }
    .cell--off { opacity: 0.35; }
    .summary { margin: 0.75rem 0 0; font-size: 0.85rem; color: var(--text-secondary); text-align: center; }

  </style>
</head>
<body class="mk">
  <header class="mk-header">
    <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo">
      <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
      <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
      <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
    </svg>
    <span class="mk-header__name">Expenses Tracker</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h3 class="mk-eyebrow">Savings trend</h3>
      <div class="month-header">
        <span class="step" role="button" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
        <h1 class="mk-title">October 2026</h1>
        <span class="step step--disabled" role="button" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </div>
      <div class="mk-card verdict">
        <span class="verdict__chip tone--up"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12 6 7.5l3 3 5.5-6M10.5 4.5h4v4" style="fill: none; stroke: currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span><span class="verdict__title">Yes, you're saving more</span></span>
      </div>
      <div class="scrim"></div>
      <div class="sheet" role="dialog" aria-label="Custom range">
        <div class="sheet__grip"></div>
        <h2 class="sheet__title">Custom range</h2>
        <p class="mk-hint">Tap the first month, then the last. Months in between fill in.</p>
        <div class="tabs">
          <span class="tab tab--on"><span class="tab__label">From</span><span class="tab__value">March 2025</span></span>
          <span class="tab"><span class="tab__label">To</span><span class="tab__value">October 2026</span></span>
        </div>
        <div class="yearbar"><span class="step" role="button" aria-label="Previous year"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span><span class="yearbar__year">2025</span><span class="step" role="button" aria-label="Next year"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span></div>
        <div class="grid"><span class="cell" role="button" aria-pressed="false">Jan</span><span class="cell" role="button" aria-pressed="false">Feb</span><span class="cell cell--end" role="button" aria-pressed="true">Mar</span><span class="cell cell--in" role="button" aria-pressed="false">Apr</span><span class="cell cell--in" role="button" aria-pressed="false">May</span><span class="cell cell--in" role="button" aria-pressed="false">Jun</span><span class="cell cell--in" role="button" aria-pressed="false">Jul</span><span class="cell cell--in" role="button" aria-pressed="false">Aug</span><span class="cell cell--in" role="button" aria-pressed="false">Sep</span><span class="cell cell--in" role="button" aria-pressed="false">Oct</span><span class="cell cell--in" role="button" aria-pressed="false">Nov</span><span class="cell cell--in" role="button" aria-pressed="false">Dec</span></div>
        <p class="summary">20 months · March 2025 – October 2026</p>
        <div class="mk-actions">
          <span class="mk-btn mk-btn--primary">Show trend</span>
          <span class="mk-btn mk-btn--secondary mk-space-top">Cancel</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
