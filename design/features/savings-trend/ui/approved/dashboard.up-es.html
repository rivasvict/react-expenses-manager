<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel: el ahorro subió, con el enlace de tendencia</title>
  <link rel="stylesheet" href="../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../system/mockup.css">
  <style>
    .mk-work-area { display: flex; flex-direction: column; }
    .month-header { margin: 1.1rem 0; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .month-header .mk-title { flex: 1 1 auto; line-height: 1.2; }
    .step { width: 2.5rem; height: 2.5rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .step--disabled { opacity: 0.35; }
    .tone--up { color: var(--income); }
    .tone--down { color: var(--expense); }
    .tone--flat { color: var(--text-secondary); }
    .arrow { width: 0.8em; height: 0.8em; flex: 0 0 auto; }
    .delta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.5rem; margin-top: 0.35rem; }
    .delta__pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .delta__pill.tone--up { background-color: var(--income-soft); }
    .delta__pill.tone--down { background-color: var(--expense-soft); }
    .delta__pill.tone--flat { background-color: var(--highlight); }
    .delta__caption { font-size: 0.82rem; color: var(--text-secondary); }

    .hero-card { display: flex; flex-direction: column; margin: 0 0 0.625rem; padding: 0; overflow: hidden; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 1.1rem 1.15rem 0.7rem; color: inherit; text-decoration: none; }
    .hero__body { display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; min-width: 0; }
    .hero__label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
    .hero__amount { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--income); }
    .hero__chevron { flex: 0 0 auto; color: var(--text-muted); display: flex; }
    .hero__chevron svg { width: 1.2rem; height: 1.2rem; }
    .hero-card__foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.3rem 1.15rem; border-top: 1px solid var(--border-subtle); }
    .hero-card__foot .delta { margin: 0; flex: 1 1 auto; min-width: 0; }
    .hero-card__trend { flex: 0 0 auto; display: flex; align-items: center; gap: 0.4rem; min-height: 2.5rem; font-size: 0.85rem; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
    .hero-card__chip { width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); color: var(--accent); background-color: var(--accent-soft); }
    .hero-card__chip svg { width: 14px; height: 14px; }
    .hero-card__trend > svg { width: 14px; height: 14px; }
    .chart { height: 214px; margin: 0 0 1.1rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .chart__ring { width: 176px; }
    .chart__ring > svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; gap: 1.1rem; margin: 0 0 0.35rem; font-size: 12px; color: var(--text-secondary); }
    .legend__dot { display: inline-block; width: 8px; height: 8px; margin-right: 0.4rem; border-radius: var(--radius-round); }
    .row { display: flex; align-items: center; color: inherit; text-decoration: none; gap: 0.75rem; margin: 0 0 0.625rem; padding: 0.85rem 0.9rem; }
    .row__chip { width: 2.4rem; height: 2.4rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); }
    .row__name { flex: 1 1 auto; font-weight: 500; }
    .row__amount { font-weight: 600; font-size: 1.05rem; }
    .row--income .row__chip { color: var(--income); background-color: var(--income-soft); }
    .row--income .row__amount { color: var(--income); }
    .row--expense .row__chip { color: var(--expense); background-color: var(--expense-soft); }
    .row--expense .row__amount { color: var(--expense); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; padding-top: 0.5rem; margin: auto -0.75rem 0; }

  </style>
</head>
<body class="mk">
  <header class="mk-header">
    <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo">
      <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
      <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
      <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
    </svg>
    <span class="mk-header__name">Expenses Tracker</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h3 class="mk-eyebrow">Balance mensual</h3>
      <div class="month-header">
        <span class="step" role="button" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
        <h1 class="mk-title">Octubre 2026</h1>
        <span class="step step--disabled" role="button" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </div>
      <div class="mk-card hero-card">
        <a class="hero" href="#summary" title="Resumen">
          <span class="hero__body">
            <span class="hero__label">Ahorro</span>
            <span class="hero__amount">$1,620.00</span>
          </span>
          <span class="hero__chevron"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
        </a>
        <div class="hero-card__foot">
          <span class="delta" role="img" aria-label="El ahorro subió un 12.5% respecto a septiembre"><span class="delta__pill tone--up" aria-hidden="true"><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5 10.5 6.5H7.4V10.5H4.6V6.5H1.5Z" style="fill: currentColor"/></svg>+12.5%</span><span class="delta__caption" aria-hidden="true">frente a sep</span></span>
          <a class="hero-card__trend" href="#savings-trend" aria-label="Tendencia del ahorro"><span class="hero-card__chip"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12 6 7.5l3 3 5.5-6M10.5 4.5h4v4" style="fill: none; stroke: currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Tendencia<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></a>
        </div>
      </div>
      <div class="chart">
        <div class="chart__ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <g transform="rotate(-90 50 50)">
              <circle cx="50" cy="50" r="40.3" stroke-width="15.4" style="fill: none; stroke: var(--chart-expense)" stroke-dasharray="154.3 98.9"/>
              <circle cx="50" cy="50" r="40.3" stroke-width="15.4" style="fill: none; stroke: var(--chart-income)" stroke-dasharray="96.5 156.7" stroke-dashoffset="-155.5"/>
            </g>
          </svg>
        </div>
        <div class="legend">
          <span><span class="legend__dot" style="background-color: var(--chart-expense)"></span>Gastos</span>
          <span><span class="legend__dot" style="background-color: var(--chart-income)"></span>Ahorro</span>
        </div>
      </div>
      <a class="mk-card row row--income" href="#incomes"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v10M3.5 7.5 8 12l4.5-4.5" style="fill: none; stroke: currentColor" stroke-width="1.6"/></svg></span><span class="row__name">Ingresos</span><span class="row__amount">$4,200.00</span></a>
      <a class="mk-card row row--expense" href="#expenses"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14V4M3.5 8.5 8 4l4.5 4.5" style="fill: none; stroke: currentColor" stroke-width="1.6"/></svg></span><span class="row__name">Gastos</span><span class="row__amount">$2,580.00</span></a>
      <div class="actions">
        <a class="mk-btn mk-btn--primary" href="#add-income">Añadir ingreso</a>
        <a class="mk-btn mk-btn--secondary" href="#add-expense">Añadir gasto</a>
      </div>
    </div>
  </main>
</body>
</html>
