<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tendencia del ahorro: 6 meses, al alza</title>
  <link rel="stylesheet" href="../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../system/mockup.css">
  <style>
    .mk-work-area { display: flex; flex-direction: column; }
    .month-header { margin: 1.1rem 0; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .month-header .mk-title { flex: 1 1 auto; line-height: 1.2; }
    .step { width: 2.5rem; height: 2.5rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .step--disabled { opacity: 0.35; }
    .tone--up { color: var(--income); }
    .tone--down { color: var(--expense); }
    .tone--flat { color: var(--text-secondary); }
    .arrow { width: 0.8em; height: 0.8em; flex: 0 0 auto; }
    .delta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.5rem; margin-top: 0.35rem; }
    .delta__pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
    .delta__pill.tone--up { background-color: var(--income-soft); }
    .delta__pill.tone--down { background-color: var(--expense-soft); }
    .delta__pill.tone--flat { background-color: var(--highlight); }
    .delta__caption { font-size: 0.82rem; color: var(--text-secondary); }

    .seg { display: flex; padding: 0.2rem; gap: 0.2rem; margin: 0 0 0.75rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .seg__item { flex: 1 1 0; min-width: 0; height: 2.6rem; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-radius: var(--radius-control); }
    .seg__item--on { color: var(--text-on-accent); background-color: var(--accent); }
    .seg__item--off { opacity: 0.35; }
    .seg__item svg { width: 1.05rem; height: 1.05rem; }
    .figure { margin: 0 0 0.75rem; padding: 1rem 1.15rem; }
    .figure__label { display: block; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
    .figure__amount { display: block; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .figure__title { display: block; font-size: 1.05rem; font-weight: 600; }
    .figure__sub { display: block; margin-top: 0.3rem; font-size: 0.85rem; color: var(--text-secondary); }
    .plot { position: relative; margin: 0 0 0.75rem; padding: 0.75rem 0.5rem 0.5rem; }
    .plot svg { display: block; width: 100%; height: auto; overflow: visible; }
    .key { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; padding: 0.5rem 0.5rem 0; font-size: 12px; color: var(--text-secondary); }
    .key__swatch { display: inline-block; width: 12px; height: 8px; margin-right: 0.4rem; vertical-align: middle; border-radius: 2px; }
    .key__line { display: inline-block; width: 14px; margin-right: 0.4rem; vertical-align: middle; border-top: 2px dashed var(--border-strong); }
    .note { margin: 0; font-size: 0.82rem; line-height: 1.45; color: var(--text-secondary); text-align: center; }
    .tip { position: absolute; padding: 0.35rem 0.6rem; font-size: 0.78rem; line-height: 1.35; background-color: var(--bg-raised-hover); border: 1px solid var(--border-strong); border-radius: var(--radius-control); box-shadow: var(--shadow-pop); white-space: nowrap; }
    .tip strong { display: block; font-size: 0.85rem; }

  </style>
</head>
<body class="mk">
  <header class="mk-header">
    <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo">
      <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
      <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
      <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
    </svg>
    <span class="mk-header__name">Expenses Tracker</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h3 class="mk-eyebrow">Tendencia del ahorro</h3>
      <div class="month-header">
        <span class="step" role="button" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
        <h1 class="mk-title">Octubre 2026</h1>
        <span class="step step--disabled" role="button" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </div>
      <div class="seg" role="group" aria-label="Rango"><span class="seg__item" role="button" aria-pressed="false" aria-label="Último mes">1M</span><span class="seg__item" role="button" aria-pressed="false" aria-label="Últimos 2 meses">2M</span><span class="seg__item" role="button" aria-pressed="false" aria-label="Últimos 3 meses">3M</span><span class="seg__item seg__item--on" role="button" aria-pressed="true" aria-label="Últimos 6 meses">6M</span><span class="seg__item" role="button" aria-pressed="false" aria-label="Últimos 12 meses">1A</span><span class="seg__item" role="button" aria-pressed="false" aria-label="Lo que va del año">YTD</span><span class="seg__item" role="button" aria-label="Rango personalizado"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" style="fill: none; stroke: currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span></div>
      <div class="mk-card figure" role="group" aria-label="Octubre frente a abril">
        <span class="figure__label">Octubre frente a abril</span>
        <span class="figure__amount tone--up">+$340.00</span>
        <span class="delta"><span class="delta__pill tone--up"><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5 10.5 6.5H7.4V10.5H4.6V6.5H1.5Z" style="fill: currentColor"/></svg>+26.6%</span><span class="delta__caption">$1,620.00 frente a $1,280.00</span></span>
      </div>
      <div class="mk-card plot">
        
        <svg viewBox="0 0 300 150" role="img" aria-label="Ahorro mensual de abril 2026 a octubre 2026, terminando en $1,620.00"><defs><clipPath id="ptes6None-up"><rect x="0" y="0" width="300" height="63.7"/></clipPath><clipPath id="ptes6None-dn"><rect x="0" y="63.7" width="300" height="86.3"/></clipPath><pattern id="ptes6None-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke-width="1.5" style="stroke: var(--expense); stroke-opacity: 0.55"/></pattern></defs><line x1="8" y1="63.7" x2="292" y2="63.7" stroke-width="1" stroke-dasharray="3 3" style="stroke: var(--border-strong)"/><polygon points="8.0,63.7 8.0,63.7 55.3,117.4 102.7,87.4 150.0,52.4 197.3,74.0 244.7,47.2 292.0,28.6 292.0,63.7" clip-path="url(#ptes6None-up)" style="fill: var(--income); fill-opacity: 0.2"/><polygon points="8.0,63.7 8.0,63.7 55.3,117.4 102.7,87.4 150.0,52.4 197.3,74.0 244.7,47.2 292.0,28.6 292.0,63.7" clip-path="url(#ptes6None-dn)" style="fill: var(--expense); fill-opacity: 0.16"/><polygon points="8.0,63.7 8.0,63.7 55.3,117.4 102.7,87.4 150.0,52.4 197.3,74.0 244.7,47.2 292.0,28.6 292.0,63.7" clip-path="url(#ptes6None-dn)" style="fill: url(#ptes6None-hatch)"/><polyline points="8.0,63.7 55.3,117.4 102.7,87.4 150.0,52.4 197.3,74.0 244.7,47.2 292.0,28.6" clip-path="url(#ptes6None-up)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="fill: none; stroke: var(--income)"/><polyline points="8.0,63.7 55.3,117.4 102.7,87.4 150.0,52.4 197.3,74.0 244.7,47.2 292.0,28.6" clip-path="url(#ptes6None-dn)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="fill: none; stroke: var(--expense)"/><text x="8.0" y="146" font-size="10" text-anchor="start" style="fill: var(--text-muted)">abr</text><text x="55.3" y="146" font-size="10" text-anchor="middle" style="fill: var(--text-muted)">may</text><text x="102.7" y="146" font-size="10" text-anchor="middle" style="fill: var(--text-muted)">jun</text><text x="150.0" y="146" font-size="10" text-anchor="middle" style="fill: var(--text-muted)">jul</text><text x="197.3" y="146" font-size="10" text-anchor="middle" style="fill: var(--text-muted)">ago</text><text x="244.7" y="146" font-size="10" text-anchor="middle" style="fill: var(--text-muted)">sep</text><text x="292.0" y="146" font-size="10" text-anchor="end" style="fill: var(--text-muted)">oct</text><circle cx="8.0" cy="63.7" r="4.5" stroke-width="2" style="fill: var(--bg-raised); stroke: var(--text-secondary)"/><circle cx="292.0" cy="28.6" r="5" stroke-width="2" style="fill: var(--income); stroke: var(--bg-raised)"/><text x="292.0" y="18.6" font-size="11" font-weight="700" text-anchor="end" style="fill: var(--text-primary)">$1,620.00</text><text x="8.0" y="53.7" font-size="11" font-weight="600" text-anchor="start" style="fill: var(--text-secondary)">Abril $1,280.00</text></svg>
        <div class="key"><span><span class="key__line"></span>Ahorro de abril</span><span><span class="key__swatch" style="background-color: var(--income-soft); border: 1px solid var(--income)"></span>Por encima</span><span><span class="key__swatch" style="background-color: var(--expense-soft); border: 1px solid var(--expense)"></span>Por debajo</span></div>
      </div>
      <p class="note">Cada punto es el ahorro de un mes. Verde donde superó a abril, rojo donde quedó por debajo.</p>
    </div>
  </main>
</body>
</html>
