<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector de mes</title>
<link rel="stylesheet" href="../../../../system/tokens.css">
<link rel="stylesheet" href="../../../../system/mockup.css">
<style>
.mk-work-area{display:flex;flex-direction:column}
.month-header{margin:1.1rem 0;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.step{width:2.5rem;height:2.5rem;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-primary);background-color:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-control)}
.step--off{opacity:.35}
.pill{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:.4rem;height:2.5rem;padding:0 .9rem;font-size:1.15rem;font-weight:700;letter-spacing:-.01em;color:var(--text-primary);background-color:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--radius-pill)}
.pill--open{border-color:var(--accent);box-shadow:0 0 0 .2rem var(--accent-soft)}
.pill svg{flex:0 0 auto;color:var(--accent)}
.hero{margin:0 0 .625rem;padding:1.1rem 1.15rem}
.hero__label{display:block;color:var(--text-secondary);font-size:.9rem;font-weight:500}
.hero__amount{display:block;font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--income)}
.row{display:flex;align-items:center;gap:.75rem;margin:0 0 .625rem;padding:.85rem .9rem}
.row__chip{width:2.4rem;height:2.4rem;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-round);color:var(--expense);background-color:var(--expense-soft)}
.row__name{flex:1 1 auto;font-weight:500}.row__amount{font-weight:600;color:var(--expense)}
.scrim{position:fixed;inset:0;background-color:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:40rem;margin:0 auto;padding:1.1rem 1.25rem 1.5rem;background-color:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-shell) var(--radius-shell) 0 0;box-shadow:var(--shadow-pop)}
.sheet__grip{width:2.5rem;height:4px;margin:0 auto .9rem;background-color:var(--border-strong);border-radius:var(--radius-pill)}
.sheet__title{margin:0 0 .25rem;font-size:1.05rem;font-weight:700}
.yearbar{display:flex;align-items:center;justify-content:space-between;margin:.6rem 0 .6rem}
.yearbar__year{font-weight:700;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.cell{height:2.75rem;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:500;border-radius:var(--radius-control);background-color:var(--bg-raised);border:1px solid var(--border-subtle)}
.cell--cur{color:var(--text-on-accent);background-color:var(--accent);border-color:var(--accent);font-weight:700}
.cell--off{opacity:.35}
.cell--today{border-color:var(--accent)}
.legend{display:flex;gap:1rem;margin:.7rem 0 0;font-size:.8rem;color:var(--text-secondary)}
.legend i{display:inline-block;width:.7rem;height:.7rem;margin-right:.35rem;vertical-align:middle;border-radius:var(--radius-control)}
.field{margin-top:.8rem}
.chips{display:flex;gap:.4rem;overflow:hidden;margin:.2rem 0 .7rem}
.chip{flex:0 0 auto;height:2.5rem;padding:0 1rem;display:flex;align-items:center;font-weight:600;font-size:.9rem;color:var(--text-secondary);background-color:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-pill)}
.chip--on{color:var(--text-on-accent);background-color:var(--accent);border-color:var(--accent)}
.panel{margin:-.5rem 0 .9rem;padding:.9rem 1rem}
.link{display:block;margin-top:.8rem;text-align:center;font-weight:600;font-size:.92rem;color:var(--accent)}
.note{margin:.75rem 0 0;font-size:.85rem;color:var(--text-secondary);text-align:center}
.sheet__head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.25rem}.sheet__close{width:2.2rem;height:2.2rem;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);background-color:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-control)}.sheet__title{margin:0}</style>
</head>
<body class="mk">
<header class="mk-header">
<svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo"><rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/><path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/><path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/></svg>
<span class="mk-header__name">Expenses Tracker</span>
</header>
<main class="mk-shell"><div class="mk-work-area">
<div class="month-header">
<span class="step" role="button" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span class="pill pill--open" role="button" aria-haspopup="dialog" aria-label="Octubre 2026">Octubre 2026<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
<span class="step step--off" role="button" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</div>

<div class="mk-card hero"><span class="hero__label">Ahorro</span><span class="hero__amount">$1,240.00</span></div>
<div class="mk-card row"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v9M4.5 8.5 8 12l3.5-3.5" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="row__name">Comer fuera</span><span class="row__amount">$86.40</span></div>
<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Ir a un mes"><div class="sheet__grip"></div><div class="sheet__head"><h2 class="sheet__title">Ir a un mes</h2><span class="sheet__close" role="button" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="yearbar"><span class="step" role="button" aria-label="Año anterior"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="yearbar__year">2026</span><span class="step step--off" role="button" aria-label="Año siguiente"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><div class="grid"><span class="cell" role="button">Ene</span><span class="cell" role="button">Feb</span><span class="cell" role="button">Mar</span><span class="cell" role="button">Abr</span><span class="cell" role="button">May</span><span class="cell" role="button">Jun</span><span class="cell" role="button">Jul</span><span class="cell" role="button">Ago</span><span class="cell" role="button">Sep</span><span class="cell cell--cur" role="button" aria-pressed="true">Oct</span><span class="cell cell--off" role="button" aria-disabled="true">Nov</span><span class="cell cell--off" role="button" aria-disabled="true">Dic</span></div><p class="legend"><span><i style="background-color:var(--accent)"></i>Seleccionado</span><span>Atenuado: aún sin datos</span></p></div>
</div></main>
</body></html>
