<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buckets — empty (ES)</title>
  <link rel="stylesheet" href="../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../system/mockup.css">
  <style>
    .empty { padding: 2rem 0 1rem; text-align: center; }
    .empty__image { display: block; width: 100%; max-width: 240px; height: auto; margin: 0 auto 1.5rem; border-radius: var(--radius-card); }
    .empty__title { margin: 0 0 0.5rem; font-size: 1.2rem; font-weight: 700; line-height: 1.2; }
    .empty__message { max-width: 420px; margin: 0 auto; line-height: 1.5; color: var(--text-secondary); }
  </style>
</head>
<body class="mk">
  <header class="mk-header">
      <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Logo de Control de Gastos">
        <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
        <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
        <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
      </svg>
    <span class="mk-header__name">Control de Gastos</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h3 class="mk-eyebrow">Límites mensuales</h3>
      <section class="empty">
        <img class="empty__image" src="../../../../../src/images/buckets-empty.png" alt="Todavía no hay límites">
        <h2 class="empty__title">Todavía no hay límites</h2>
        <p class="empty__message">Aún no has añadido ningún límite. Añade el primero para empezar a controlar tu gasto mensual.</p>
      </section>
      <a class="mk-btn mk-btn--primary mk-space-top" href="#">Añadir límite</a>
      <button class="mk-btn mk-btn--secondary mk-space-top" type="button">Volver</button>
    </div>
  </main>
</body>
</html>
