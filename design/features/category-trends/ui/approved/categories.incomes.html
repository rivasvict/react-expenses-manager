<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Category trends: Category trends, incomes</title>
  <link rel="stylesheet" href="../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../system/mockup.css">
  <style>
.mk-work-area { display: flex; flex-direction: column; }
.month-header { margin: 1.1rem 0; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.month-header .mk-title { flex: 1 1 auto; line-height: 1.2; }
.step { width: 2.5rem; height: 2.5rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
.step--disabled { opacity: 0.35; }
.tone--good { color: var(--income); } .tone--bad { color: var(--expense); } .tone--flat { color: var(--text-secondary); }
.arrow { width: 0.8em; height: 0.8em; flex: 0 0 auto; }
.delta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.5rem; margin-top: 0.35rem; }
.delta__pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.15rem 0.6rem; border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 700; line-height: 1.5; }
.delta__pill.tone--good { background-color: var(--income-soft); } .delta__pill.tone--bad { background-color: var(--expense-soft); }
.delta__caption { font-size: 0.82rem; color: var(--text-secondary); }
.seg { display: flex; padding: 0.2rem; gap: 0.2rem; margin: 0 0 0.75rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
.seg__item { flex: 1 1 0; min-width: 0; height: 2.6rem; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); border-radius: var(--radius-control); }
.seg__item--on { color: var(--text-on-accent); background-color: var(--accent); }
.seg__item svg { width: 1.05rem; height: 1.05rem; }
.figure { margin: 0 0 0.75rem; padding: 1rem 1.15rem; }
.figure__label { display: block; color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
.figure__amount { display: block; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.figure__title { display: block; font-size: 1.05rem; font-weight: 600; }
.figure__sub { display: block; margin-top: 0.3rem; font-size: 0.85rem; color: var(--text-secondary); }
.plot { margin: 0 0 0.75rem; padding: 0.75rem 0.5rem 0.5rem; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.key { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; padding: 0.5rem 0.5rem 0; font-size: 12px; color: var(--text-secondary); }
.key__swatch { display: inline-block; width: 12px; height: 8px; margin-right: 0.4rem; vertical-align: middle; border-radius: var(--radius-pill); }
.key__line { display: inline-block; width: 14px; margin-right: 0.4rem; vertical-align: middle; border-top: 2px dashed var(--border-strong); }
.note { margin: 0; font-size: 0.82rem; line-height: 1.45; color: var(--text-secondary); text-align: center; }
.view { display: flex; margin: -0.25rem -0.4rem 0.6rem; border-bottom: 1px solid var(--border-subtle); }
.view__tab { flex: 1 1 0; height: 2.5rem; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.view__tab--on { color: var(--text-primary); border-bottom-color: var(--accent); }
/* picker row: which thing the trend is about */
.pick { display: flex; align-items: center; gap: 0.7rem; min-height: 3rem; padding: 0.4rem 0.75rem 0.4rem 0.8rem; margin: 0 0 0.75rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); color: var(--text-primary); }
.pick__main { flex: 1; min-width: 0; }
.pick__hint { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); line-height: 1.2; }
.pick__name { display: block; font-weight: 600; font-size: 0.98rem; overflow-wrap: anywhere; line-height: 1.3; }
.pick__end { color: var(--text-secondary); }
/* rows */
.stack { display: flex; flex-direction: column; gap: 0.5rem; }
.row { display: flex; align-items: center; gap: 0.75rem; min-height: 3.5rem; padding: 0.6rem 0.75rem 0.6rem 0.9rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); color: var(--text-primary); }
.row__main { flex: 1; min-width: 0; }
.row__name { display: block; font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
.row__meta { display: block; font-size: 0.8rem; color: var(--text-secondary); }
.row__end { color: var(--text-secondary); font-size: 1.1rem; }
.row__figs { flex: none; display: flex; flex-direction: column; align-items: flex-end; min-width: 5.5rem; }
.row__amt { display: block; font-weight: 600; font-size: 0.92rem; }
.spark { width: 3.6rem; height: 1.6rem; flex: none; }
.mpill { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 0.4rem; height: 2.5rem; padding: 0 0.9rem; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); }
.mpill svg { flex: 0 0 auto; color: var(--accent); }
.pill-sm { display: inline-flex; align-items: center; gap: 0.2rem; padding: 0 0.45rem; border-radius: var(--radius-pill); font-size: 0.74rem; font-weight: 700; line-height: 1.5; }
.pill-sm.tone--good { background-color: var(--income-soft); } .pill-sm.tone--bad { background-color: var(--expense-soft); } .pill-sm.tone--flat { background-color: var(--highlight); }
.tabs { display: flex; border-bottom: 1px solid var(--border-subtle); margin: 0 0 0.75rem; }
.tabs__item { flex: 1; display: flex; align-items: center; justify-content: center; height: 2.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs__item--sel { color: var(--text-primary); border-bottom-color: var(--accent); }
.section-label { margin: 0.9rem 0 0.45rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); display: flex; justify-content: space-between; }
/* the trend link: same gold chip + word + chevron as the dashboard's */
.tlink { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 0.4rem; min-height: 2.5rem; color: var(--accent); font-weight: 600; font-size: 0.92rem; }
.tlink__chip { width: 1.6rem; height: 1.6rem; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); background-color: var(--accent-soft); }
.tlink__chip svg { width: 0.95rem; height: 0.95rem; }
.linkrow { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.2rem 0.2rem 0.2rem 0.8rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
.linkrow__text { font-size: 0.86rem; color: var(--text-secondary); line-height: 1.35; }
.hist { display: flex; flex-direction: column; margin: 0 0 0.75rem; padding: 1rem 1.15rem; text-align: center; }
.hist .mk-chip { align-self: center; margin-bottom: 0.5rem; }
.hist__title { font-weight: 600; font-size: 1.05rem; }
.hist__text { margin-top: 0.3rem; font-size: 0.85rem; color: var(--text-secondary); }
.hist .mk-btn { margin-top: 0.9rem; }
/* sheet */
.scrim { position: fixed; inset: 0; background-color: var(--scrim); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 40rem; margin: 0 auto; max-height: 88vh; overflow: hidden; padding: 0.6rem 1rem 1rem; background-color: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-shell) var(--radius-shell) 0 0; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; gap: 0.6rem; }
.sheet__grab { width: 2.5rem; height: 0.25rem; margin: 0 auto 0.2rem; border-radius: var(--radius-round); background-color: var(--border-strong); }
.sheet__head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.sheet__title { margin: 0; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.sheet__type { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
.sheet__close { width: 2.4rem; height: 2.4rem; flex: none; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); background-color: var(--bg-surface); color: var(--text-secondary); }
.sheet__body { display: flex; flex-direction: column; gap: 0.6rem; overflow: auto; min-height: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; text-align: center; padding: 0.7rem 0.4rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
.stats__value { font-weight: 700; font-size: 1rem; }
.radio { display: flex; align-items: center; gap: 0.7rem; min-height: 3rem; padding: 0.5rem 0.85rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-control); background-color: var(--bg-surface); }
.radio--sel { border-color: var(--accent); background-color: var(--accent-soft); }
.radio__dot { flex: none; width: 1.15rem; height: 1.15rem; border-radius: var(--radius-round); border: 2px solid var(--border-strong); }
.radio--sel .radio__dot { border: 0.32rem solid var(--accent); }
.radio__title { flex: 1; font-weight: 600; font-size: 0.93rem; }

.scope { align-self: center; display: inline-flex; padding: 0.2rem; gap: 0.15rem; margin: 0 0 0.1rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); }
.scope__item { min-height: 2.5rem; padding: 0 1.1rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); border-radius: var(--radius-pill); }
.scope__item svg { width: 1rem; height: 1rem; }
.scope__item--on { color: var(--text-primary); background-color: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.back { display: flex; align-items: center; gap: 0.2rem; min-height: 2.5rem; margin: 0 0 0.4rem -0.3rem; color: var(--accent); font-weight: 600; font-size: 0.92rem; }
</style>
</head>
<body class="mk">
  <header class="mk-header"><svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo"><rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/><path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/><path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/></svg><span class="mk-header__name">Expenses Tracker</span></header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <div class="scope" role="tablist" aria-label="Trend of"><span class="scope__item " role="tab" aria-selected="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m2 11 4-4 3 3 5-6M10.5 4H14v3.5" style="fill: none; stroke: currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Savings</span><span class="scope__item scope__item--on" role="tab" aria-selected="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.2" style="fill: none; stroke: currentColor" stroke-width="1.5"/><rect x="9" y="2" width="5" height="5" rx="1.2" style="fill: none; stroke: currentColor" stroke-width="1.5"/><rect x="2" y="9" width="5" height="5" rx="1.2" style="fill: none; stroke: currentColor" stroke-width="1.5"/><rect x="9" y="9" width="5" height="5" rx="1.2" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg>Categories</span></div>
      <div class="month-header"><span class="step" role="button" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span><span class="mpill" role="button" aria-haspopup="dialog" aria-label="October 2026">October 2026<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" style="fill:none;stroke:currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="step step--disabled" role="button" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span></div>
      <div class="seg" role="group" aria-label="Range"><span class="seg__item" role="button">1M</span><span class="seg__item" role="button">2M</span><span class="seg__item" role="button">3M</span><span class="seg__item seg__item--on" role="button" aria-pressed="true">6M</span><span class="seg__item" role="button">1Y</span><span class="seg__item" role="button">YTD</span><span class="seg__item" role="button" aria-label="Custom range"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2" style="fill: none; stroke: currentColor" stroke-width="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span></div>
      <div class="tabs"><span class="tabs__item ">Expenses</span><span class="tabs__item tabs__item--sel">Incomes</span></div>
      <p class="note" style="text-align:left;margin-bottom:0.6rem">October vs April, biggest change first.</p>
      <div class="stack">
<div class="row"><span class="row__main"><span class="row__name">Freelance</span><span class="row__meta">was $200.00</span></span><svg class="spark" viewBox="0 0 60 26" aria-hidden="true"><polyline points="2.0,16.5 11.3,22.0 20.7,12.3 30.0,13.7 39.3,10.9 48.7,8.2 58.0,4.0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="fill: none; stroke: var(--income)"/></svg><span class="row__figs"><span class="row__amt">$650.00</span><span class="pill-sm tone--good"><svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5 10.5 6.5H7.4V10.5H4.6V6.5H1.5Z" style="fill: currentColor"/></svg>+225%</span></span></div>
<div class="row"><span class="row__main"><span class="row__name">Salary</span><span class="row__meta">was $3,200.00</span></span><svg class="spark" viewBox="0 0 60 26" aria-hidden="true"><polyline points="2.0,22.0 11.3,22.0 20.7,22.0 30.0,22.0 39.3,22.0 48.7,22.0 58.0,22.0" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" style="fill: none; stroke: var(--text-secondary)"/></svg><span class="row__figs"><span class="row__amt">$3,200.00</span><span class="pill-sm tone--flat">0%</span></span></div>
      </div>
      <p class="note" style="margin-top:0.8rem">Tap a category for its full trend.</p>
    </div>
  </main>
</body>
</html>
