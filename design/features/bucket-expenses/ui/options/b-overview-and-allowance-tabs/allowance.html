<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B · Allowance tab</title>
  <link rel="stylesheet" href="../../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../../system/mockup.css">
  <style>
.warn{color:var(--chart-warning)}.ok{color:var(--chart-income)}.danger{color:var(--chart-expense)}
.nw{white-space:nowrap}
.mk-work-area{padding-bottom:1.14rem;min-height:0}
.card{background-color:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:0.85rem 0.9rem;margin:0 0 0.625rem}
.hd{display:flex;align-items:baseline;gap:0.75rem}
.hd__name{flex:1 1 0;min-width:0;margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.hd__pct{font-size:0.9rem;font-weight:700}
.bar{height:8px;border-radius:var(--radius-pill);background:var(--track);overflow:hidden;margin-top:0.55rem}
.bar i{display:block;height:100%;border-radius:var(--radius-pill)}
.bar .ok{background-color:var(--chart-income)}.bar .warn{background-color:var(--chart-warning)}.bar .danger{background-color:var(--chart-expense)}
.stats{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:0.5rem 0.75rem;margin-top:0.65rem}
.stat span{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted)}
.stat strong{display:block;margin-top:0.1rem;white-space:nowrap;font-size:1rem;font-weight:600;line-height:1.25}
.stat--left{text-align:right;margin-left:auto}.stat--left strong{font-size:1.3rem;font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:0.1rem 0.9rem;margin:0.6rem 0 0;padding-top:0.55rem;border-top:1px solid var(--border-subtle);font-size:0.78rem;color:var(--text-muted)}
.foot .debt{color:var(--expense)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:0.75rem;margin:1rem 0.15rem 0.45rem}
.sec h2{margin:0;font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-secondary)}
.sec span{font-size:0.85rem;font-weight:600}
.list{background-color:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:0 0.9rem;margin:0 0 0.625rem}
.row{display:flex;align-items:center;gap:0.7rem;padding:0.7rem 0;border-top:1px solid var(--border-subtle)}
.row:first-child{border-top:0}
.row__body{flex:1 1 0;min-width:0}
.row__desc{margin:0;font-size:0.95rem;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.row__date{margin:0.1rem 0 0;font-size:0.78rem;color:var(--text-muted)}
.row__amt{flex:0 0 auto;font-weight:700;font-size:0.95rem;color:var(--expense);white-space:nowrap}
.more{display:flex;align-items:center;justify-content:center;height:2.6rem;margin:0 0 0.625rem;color:var(--accent);font-weight:600;font-size:0.9rem;text-decoration:none}
.empty{text-align:center;padding:1.4rem 1rem 1.2rem}
.empty p{margin:0.5rem 0 0}
.empty .mk-btn{margin-top:0.9rem}
.seg{display:flex;gap:0.25rem;padding:0.25rem;border:1px solid var(--border-subtle);border-radius:var(--radius-pill);background-color:var(--bg-raised);margin:0.8rem 0 0.8rem}
.seg span{flex:1;height:2.4rem;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);font-weight:600;font-size:0.92rem;color:var(--text-secondary)}
.seg .on{background-color:var(--accent-soft);color:var(--accent)}
.fcard{background-color:var(--bg-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:0.9rem 1rem 1rem;margin:0 0 0.625rem}
.mini{display:flex;align-items:baseline;justify-content:space-between;gap:0.75rem;font-size:0.9rem}
.mini strong{font-size:1.1rem}
.scrim{position:fixed;inset:0;background-color:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:40rem;margin:0 auto;padding:0.6rem 1rem 1rem;background-color:var(--bg-raised);border:1px solid var(--border-strong);border-radius:var(--radius-shell) var(--radius-shell) 0 0;box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:0.6rem}
.sheet__grab{width:2.5rem;height:0.25rem;margin:0 auto 0.2rem;border-radius:var(--radius-round);background-color:var(--border-strong)}
.sheet__title{margin:0;font-size:1.05rem;font-weight:700}
.sheet .mk-btn{margin-top:0}
.ed{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-top:0.6rem;padding-top:0.6rem;border-top:1px solid var(--border-subtle)}
.ed__txt span{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted)}
.ed__txt strong{font-size:1rem}
.ed__btn{display:flex;align-items:center;gap:0.4rem;height:2.6rem;padding:0 0.9rem;border:1px solid var(--border-strong);border-radius:var(--radius-control);font-weight:600;font-size:0.9rem;color:var(--text-primary);background:transparent}
.wk{margin:0.9rem 0.15rem 0.4rem;display:flex;justify-content:space-between;font-size:0.78rem;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em}
.wk span:last-child{color:var(--text-primary)}
.weeks{display:flex;align-items:flex-end;gap:0.5rem;height:4.2rem;margin-top:0.8rem}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0.25rem;height:100%}
.weeks i{display:block;width:100%;border-radius:0.3rem 0.3rem 0 0;background-color:var(--chart-categorical-1)}
.weeks small{font-size:0.68rem;color:var(--text-muted)}
.big{font-size:2rem;font-weight:700;line-height:1.1;letter-spacing:-0.02em}
.cap{display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted)}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:0.75rem;margin-top:0.2rem}
.triple{display:flex;justify-content:space-between;gap:0.5rem;margin-top:0.7rem;padding-top:0.6rem;border-top:1px solid var(--border-subtle)}
.triple strong{display:block;font-size:0.95rem;white-space:nowrap}
</style>
</head>
<body class="mk">
  <header class="mk-header">
    <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo">
      <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
      <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
      <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
    </svg>
    <span class="mk-header__name">Expenses Tracker</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
<h3 class="mk-eyebrow">Edit bucket: Eating out</h3><div class="seg" role="tablist"><span class="">Overview</span><span class="on">Allowance</span></div><section class="card"><div class="mini"><span class="mk-text-secondary">Oct 2026 · Spent CA$171.83</span><strong class="warn nw">CA$84.80 left</strong></div><div class="bar"><i class="warn" style="width:67%"></i></div></section><section class="fcard">
        <label class="mk-label" for="a">Monthly allowance</label>
        <p class="mk-hint">Changes apply from the month you are viewing onward; earlier months keep their previous limit.</p>
        <div class="mk-input" id="a">300</div>
      </section><div class="mk-actions"><a class="mk-btn mk-btn--primary" href="#">Submit</a><button class="mk-btn mk-btn--secondary mk-space-top" type="button">Cancel</button></div>
    </div>
  </main>
</body>
</html>
