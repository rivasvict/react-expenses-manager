<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Option D: Currency sheet</title>
  <link rel="stylesheet" href="../../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../../system/mockup.css">
  <style>
    .page-title { margin: 0 0 0.625rem; }
    .stack { display: flex; flex-direction: column; gap: 0.625rem; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; min-height: 3.4rem; padding: 0.65rem 0.9rem; background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); color: var(--text-primary); font: inherit; width: 100%; text-align: left; }
    .row__label { font-weight: 600; font-size: 0.95rem; }
    .row__value { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.92rem; min-width: 0; }
    .row__sub { display: block; color: var(--text-secondary); font-size: 0.78rem; font-weight: 400; }
    .opt { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; padding: 0.65rem 0.85rem; min-height: 3.1rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .opt--sel { background-color: var(--accent-soft); border-color: var(--accent); }
    .opt__name { font-size: 0.95rem; font-weight: 600; display: block; }
    .opt__hint { font-size: 0.78rem; color: var(--text-secondary); display: block; }
    .check { color: var(--accent); font-weight: 700; }
    .note { margin: 0.5rem 0.2rem 0; font-size: 0.82rem; line-height: 1.45; color: var(--text-secondary); }
    .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.25rem; padding: 0.25rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .seg__item { min-height: 2.7rem; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-control); font-size: 0.92rem; font-weight: 600; color: var(--text-secondary); text-align: center; padding: 0 0.3rem; }
    .seg__item--sel { background-color: var(--accent-soft); color: var(--text-primary); box-shadow: inset 0 0 0 1px var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
    .tile { min-height: 3.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.05rem; background-color: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .tile--sel { background-color: var(--accent-soft); border-color: var(--accent); }
    .tile__sym { font-weight: 700; font-size: 1rem; }
    .tile__code { font-size: 0.74rem; color: var(--text-secondary); }
    .sec-title { margin: 0 0 0.5rem; font-size: 1rem; font-weight: 700; }
    .scrim { position: fixed; inset: 0; background-color: var(--bg-page); opacity: 0.8; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 40rem; margin: 0 auto; max-height: 82vh; overflow: hidden; padding: 0.6rem 1rem 1rem; background-color: var(--bg-raised); border: 1px solid var(--border-strong); border-radius: var(--radius-shell) var(--radius-shell) 0 0; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 0.4rem; }
    .sheet__grab { width: 2.5rem; height: 0.25rem; margin: 0 auto 0.3rem; border-radius: var(--radius-round); background-color: var(--border-strong); }
    .sheet__list { display: flex; flex-direction: column; gap: 0.35rem; overflow: hidden; }
    .back { display: inline-flex; align-items: center; min-height: 2.5rem; color: var(--text-secondary); font-size: 0.9rem; }
  </style>
</head>
<body class="mk">
  <header class="mk-header">
    <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo"><rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/><path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/><path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/></svg>
    <span class="mk-header__name">Expenses Tracker</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <h1 class="mk-title page-title">Settings</h1>
      <section class="mk-card">
        <div class="stack">
          <button class="row" type="button"><span class="row__label">Language<span class="row__sub">Applies right away</span></span><span class="row__value">English <span aria-hidden="true">›</span></span></button>
          <button class="row" type="button"><span class="row__label">Currency<span class="row__sub">Symbol and format only</span></span><span class="row__value">$ · USD <span aria-hidden="true">›</span></span></button>
        </div>
      </section>
<div class="mk-actions"><button class="mk-btn mk-btn--secondary" type="button">Go Back</button></div>
    </div>
  </main>
  <div class="scrim" aria-hidden="true"></div>
  <div class="sheet" role="dialog" aria-label="Currency">
    <div class="sheet__grab" aria-hidden="true"></div>
    <h2 class="sec-title" style="margin:0">Currency</h2>
    <div class="grid" role="radiogroup"><div class="tile tile--sel"><span class="tile__sym">$</span><span class="tile__code">USD</span></div><div class="tile"><span class="tile__sym">€</span><span class="tile__code">EUR</span></div><div class="tile"><span class="tile__sym">£</span><span class="tile__code">GBP</span></div><div class="tile"><span class="tile__sym">CA$</span><span class="tile__code">CAD</span></div><div class="tile"><span class="tile__sym">A$</span><span class="tile__code">AUD</span></div><div class="tile"><span class="tile__sym">MX$</span><span class="tile__code">MXN</span></div><div class="tile"><span class="tile__sym">R$</span><span class="tile__code">BRL</span></div><div class="tile"><span class="tile__sym">COL$</span><span class="tile__code">COP</span></div><div class="tile"><span class="tile__sym">AR$</span><span class="tile__code">ARS</span></div><div class="tile"><span class="tile__sym">CLP$</span><span class="tile__code">CLP</span></div><div class="tile"><span class="tile__sym">¥</span><span class="tile__code">JPY</span></div><div class="tile"><span class="tile__sym">₹</span><span class="tile__code">INR</span></div></div>
    <p class="note" style="margin:0.3rem 0.2rem 0"><strong>US Dollar</strong> — It only changes the symbol and how amounts are written — nothing is converted. Saved on this device only.</p>
  </div>
</body>
</html>
