<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard, nothing to compare (Strip above the chart)</title>
  <link rel="stylesheet" href="../../../../../system/tokens.css">
  <link rel="stylesheet" href="../../../../../system/mockup.css">
  <style>
    .month-header { margin: 0.9rem 0; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .month-header .mk-title { flex: 1 1 auto; }
    .step { width: 2.5rem; height: 2.5rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--text-primary); background-color: var(--bg-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); }
    .step--disabled { opacity: 0.35; }
    .hero { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0 0 0.625rem; padding: 1.1rem 1.15rem; color: inherit; text-decoration: none; }
    .hero__body { display: flex; flex-direction: column; align-items: flex-start; gap: 0.1rem; min-width: 0; }
    .hero__label { color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; }
    .hero__amount { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--income); }
    .hero__chevron { flex: 0 0 auto; color: var(--text-muted); display: flex; }
    .chart { margin: 0 0 0.9rem; display: flex; flex-direction: column; align-items: center; }
    .chart__ring { position: relative; width: 70%; max-width: 250px; }
    .chart__ring > svg { display: block; width: 100%; height: auto; }
    .legend { display: flex; gap: 1.1rem; margin-top: 0.6rem; font-size: 12px; color: var(--text-secondary); }
    .legend__dot { display: inline-block; width: 8px; height: 8px; margin-right: 0.4rem; border-radius: var(--radius-round); }
    .row { display: flex; align-items: center; color: inherit; text-decoration: none; gap: 0.75rem; margin: 0 0 0.625rem; padding: 0.85rem 0.9rem; }
    .row__chip { width: 2.4rem; height: 2.4rem; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-round); }
    .row__name { flex: 1 1 auto; font-weight: 500; }
    .row__amount { font-weight: 600; font-size: 1.05rem; }
    .row--income .row__chip { color: var(--income); background-color: var(--income-soft); }
    .row--income .row__amount { color: var(--income); }
    .row--expense .row__chip { color: var(--expense); background-color: var(--expense-soft); }
    .row--expense .row__amount { color: var(--expense); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; padding-top: 0.5rem; }
    .arrow { width: 0.8em; height: 0.8em; flex: 0 0 auto; }
    .tone--up { color: var(--income); }
    .tone--down { color: var(--expense); }

    .strip { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0 0 0.9rem; padding: 0.7rem 0.95rem; }
    .strip__label { min-width: 0; font-size: 0.85rem; color: var(--text-secondary); }
    .strip__value { display: inline-flex; align-items: center; gap: 0.35rem; flex: 0 0 auto; font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
    .strip.tone--up { background-color: var(--income-soft); border-color: color-mix(in srgb, var(--income) 28%, transparent); }
    .strip.tone--down { background-color: var(--expense-soft); border-color: color-mix(in srgb, var(--expense) 28%, transparent); }
  </style>
</head>
<body class="mk">
  <header class="mk-header">
    <svg class="mk-header__logo" viewBox="0 0 48 48" role="img" aria-label="Expenses Tracker logo">
      <rect x="1.5" y="1.5" width="45" height="45" rx="11" stroke-width="1.6" style="fill: var(--bg-surface); stroke: var(--accent)"/>
      <path d="M8.5 19.6 17.6 15l21.9 7.9-9.1 4.6z" style="fill: var(--accent)"/>
      <path d="M8.5 28.6 17.6 24l21.9 7.9-9.1 4.6z" style="fill: var(--brand-mark-shade)"/>
    </svg>
    <span class="mk-header__name">Expenses Tracker</span>
  </header>
  <main class="mk-shell">
    <div class="mk-work-area">
      <div class="month-header">
        <span class="step step--disabled" role="button" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
        <h1 class="mk-title">October 2026</h1>
        <span class="step step--disabled" role="button" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </div>
      <a class="mk-card hero" href="#summary" title="Summary">
        <span class="hero__body">
          <span class="hero__label">Savings</span>
          <span class="hero__amount">$1,620.00</span>
        </span>
        <span class="hero__chevron"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" style="fill: none; stroke: currentColor" stroke-width="1.5"/></svg></span>
      </a>
      <div class="mk-card strip"><span class="strip__label">Nothing to compare with September</span></div>
      <div class="chart">
        <div class="chart__ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <g transform="rotate(-90 50 50)">
              <circle cx="50" cy="50" r="40.3" stroke-width="15.4" style="fill: none; stroke: var(--chart-expense)" stroke-dasharray="154.3 98.9"/>
              <circle cx="50" cy="50" r="40.3" stroke-width="15.4" style="fill: none; stroke: var(--chart-income)" stroke-dasharray="96.5 156.7" stroke-dashoffset="-155.5"/>
            </g>
          </svg>
        </div>
        <div class="legend">
          <span><span class="legend__dot" style="background-color: var(--chart-expense)"></span>Expenses</span>
          <span><span class="legend__dot" style="background-color: var(--chart-income)"></span>Savings</span>
        </div>
      </div>
      <a class="mk-card row row--income" href="#incomes"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v10M3.5 7.5 8 12l4.5-4.5" style="fill: none; stroke: currentColor" stroke-width="1.6"/></svg></span><span class="row__name">Incomes</span><span class="row__amount">$4,200.00</span></a>
      <a class="mk-card row row--expense" href="#expenses"><span class="row__chip"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14V4M3.5 8.5 8 4l4.5 4.5" style="fill: none; stroke: currentColor" stroke-width="1.6"/></svg></span><span class="row__name">Expenses</span><span class="row__amount">$2,580.00</span></a>
      <div class="actions">
        <a class="mk-btn mk-btn--primary" href="#add-income">Add Income</a>
        <a class="mk-btn mk-btn--secondary" href="#add-expense">Add Expenses</a>
      </div>
    </div>
  </main>
</body>
</html>
