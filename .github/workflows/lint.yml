name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Reused by release.yml so a release runs the very same checks.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Both enforce the design-token rules in design/system/README.md.
      - run: npm run lint

      - run: npm run lint:styles
