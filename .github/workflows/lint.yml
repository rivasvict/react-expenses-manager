name: Lint

on:
  push:
    branches:
      - master
  # Every pull request, including one stacked on another branch.
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # Both enforce the design-token rules in design/system/README.md.
      - run: npm run lint

      - run: npm run lint:styles
