name: Claude Code Review

on:
  # Every pull request, including one stacked on another branch.
  # Add "synchronize" to review every push.
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Explicit allowlist of GitHub logins.
    if: contains(fromJSON('["rivasvict", "rivasvictron"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed so --comment can post the review.
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 20
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
